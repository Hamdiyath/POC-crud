

# Nom de l'application
spring.application.name=poc-crud

# Active le profil local : Spring charge aussi application-local.properties
spring.profiles.active=local

# Hibernate crée/met à jour les tables à partir des entités
spring.jpa.hibernate.ddl-auto=update

# Affiche le SQL généré dans la console
spring.jpa.show-sql=true

# Désactive l'ouverture de session pendant le rendu de la vue (supprime l'avertissement du log)
spring.jpa.open-in-view=false